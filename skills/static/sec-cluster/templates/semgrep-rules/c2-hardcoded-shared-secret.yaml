rules:
  - id: hardcoded-shared-secret-comparison
    languages: [java]
    severity: ERROR
    message: |
      Endpoint guarded by hardcoded shared-secret comparison.
      Cluster C2: Sanitization/Validation gap.
      Replace with mTLS, HMAC signing, or proper API key management.
    patterns:
      - pattern-either:
          - pattern: |
              if ($CONST.equals($X)) {
                ...
              }
          # Adapt: add project-specific constant patterns below
          # - pattern: |
          #     if ("hardcoded-value".equals($X)) { ... }
      - metavariable-regex:
          metavariable: $CONST
          # Adapt: replace with project-specific constant names
          regex: "(PROMISED_VALUE|.*SECRET.*|.*API_KEY.*|.*SHARED_KEY.*|.*MANUAL.*)"
    metadata:
      cluster: C2
      category: authentication
      technology: java
      adapt_guidance: |
        Replace metavariable-regex with constants specific to your codebase.
        Search for: static final String fields compared in if-guards on endpoints.
